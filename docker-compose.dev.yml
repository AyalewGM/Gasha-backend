# Local dev stack for the M2 ingestion worker: single-broker Kafka (KRaft)
# plus Postgres for durable stores. Not a production topology.
#
#   docker compose -f docker-compose.dev.yml up -d
#   GASHA_POSTGRES_DSN=postgresql://gasha:gasha@localhost:5432/gasha \
#   GASHA_POLICIES_PATH=policies.dev.json \
#   gasha-worker
services:
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: gasha-dev-cluster-00001

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gasha
      POSTGRES_PASSWORD: gasha
      POSTGRES_DB: gasha
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
