name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,ml]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q


  protected-api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Execute installed protected FastAPI negative matrix
        run: |
          mkdir -p test-results
          python -m pytest -vv -rA --junitxml=test-results/protected-api.xml \
            tests/test_api_security.py \
            tests/test_api_authorization_denial_scope.py \
            tests/test_api_case_history.py \
            tests/test_api_case_queue.py \
            tests/test_api_case_transitions.py \
            tests/test_api_model_serving_containment.py \
            tests/test_security_access.py \
            tests/test_audit_actor_identity.py
      - name: Require executed negative tests without skipped cases
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          p = Path("test-results/protected-api.xml")
          assert p.is_file(), "Protected API evidence missing"
          root = ElementTree.parse(p).getroot()
          cases = list(root.iter("testcase"))
          bad = list(root.iter("failure")) + list(root.iter("error"))
          skipped = list(root.iter("skipped"))
          names = " ".join(c.attrib.get("name", "") for c in cases)
          required = (
              "identity_and_role_denied",
              "mutated_verifier_principal_denied_without_callback_or_reader",
              "denied_credentials_and_capability_do_not_read",
              "cross_tenant_and_spoofed_proxy_claims_cannot_read",
              "audit_outage_prevents_case_reader_access",
              "untrusted_reader_payload_fails_closed",
              "invalid_initial_case_lifecycle_is_denied",
              "invalid_subsequent_case_lifecycle_is_denied",
              "cross_tenant_denial",
              "missing_context_or_audit_fails_closed",
              "model_activation_denied_even_with_registry",
              "rules_only_remain_deterministic_with_registry_installed",
              "root_path_tenant_role_and_body_spoofing",
              "root_path_concurrent_outcome_attempts_never_mutate",
              "audit_actor_distinguishes_delimiter_shifted_identities",
          )
          assert len(cases) >= 25, f"Too few protected API tests: {len(cases)}"
          assert not skipped and not bad, (len(skipped), len(bad))
          assert all(n in names for n in required), "Required security regressions missing"
          print(f"Protected API evidence: {len(cases)} passed; zero skips/failures")
          PY
      - name: Preserve protected API test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-api-evidence
          path: test-results/protected-api.xml
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gasha-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Assert bank image excludes synthetic entrypoint
        run: |
          docker run --rm gasha-backend:ci python -c 'from importlib.util import find_spec; assert find_spec("gasha.api.synthetic") is None, "synthetic app present in bank image"'
          docker run --rm gasha-backend:ci python -c 'from gasha.api.main import app; assert app.state.identity_verifier is None; assert app.state.security_audit is None'

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gasha_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: gasha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gasha_test -d gasha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GASHA_TEST_POSTGRES_DSN: postgresql://gasha_test:synthetic_ci_only@localhost:5432/gasha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,postgres]"
      - name: Record PostgreSQL version
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["GASHA_TEST_POSTGRES_DSN"]) as connection:
              version = connection.execute("SHOW server_version_num").fetchone()[0]
              assert 160000 <= int(version) < 170000, version
              print("PostgreSQL server_version_num:", version)
          PY
      - name: Run PostgreSQL tests with failure and performance evidence
        shell: bash
        run: |
          mkdir -p test-results
          pytest -vv -rA --capture=tee-sys --junitxml=test-results/postgres.xml tests/test_postgres*.py 2>&1 | tee test-results/postgres.log
      - name: Require executed tests and zero skips
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          report = Path("test-results/postgres.xml")
          assert report.is_file(), "PostgreSQL test report missing"
          root = ElementTree.parse(report).getroot()
          cases = list(root.iter("testcase"))
          skipped = list(root.iter("skipped"))
          failures = list(root.iter("failure")) + list(root.iter("error"))
          print(f"PostgreSQL evidence: {len(cases)} tests, {len(skipped)} skips, {len(failures)} failures/errors")
          assert cases, "No PostgreSQL tests executed"
          assert not skipped, "PostgreSQL verification must have zero skips"
          assert not failures, "PostgreSQL verification contains failures/errors"
          PY
      - name: Preserve PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-evidence
          path: test-results/
          if-no-files-found: error

  redis-feature-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GASHA_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,redis]"
      - run: pytest -q tests/test_feature_set_v1.py tests/test_redis_feature_history.py
