[project]
name = "gasha-backend"
version = "0.1.0"
description = "Gasha real-time fraud intelligence and decision platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic-settings>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9","httpx>=0.27,<1","ruff>=0.7,<1","mypy>=1.11,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
